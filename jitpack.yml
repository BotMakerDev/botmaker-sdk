jdk:
  - openjdk25
before_install:
  # The build brings its own JDK and its own Maven, and uses nothing of the builder's but curl, tar and cc. Some
  # of JitPack's builders fail SDKMan's java 25.0.1.0+8-open download (no JAVA_HOME); the builders that break
  # the build are another kind, see the statx shim below.
  # The retries are a shell loop over plain curl flags: one builder's curl is too old for --retry-all-errors.
  - for i in 1 2 3 4 5; do curl -fsSL -o "$HOME/temurin25.tar.gz" https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse && break; sleep 10; done
  - mkdir -p "$HOME/temurin25" && tar -xzf "$HOME/temurin25.tar.gz" -C "$HOME/temurin25" --strip-components=1 --exclude='*/lib/src.zip' && rm -f "$HOME/temurin25.tar.gz"
  - for i in 1 2 3 4 5; do curl -fsSL -o "$HOME/maven.tar.gz" https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz && break; sleep 10; done
  - mkdir -p "$HOME/maven" && tar -xzf "$HOME/maven.tar.gz" -C "$HOME/maven" --strip-components=1 && rm -f "$HOME/maven.tar.gz"
install:
  # Some builders (kernel 4.14) refuse the statx syscall with EPERM, which Java 22+ uses for every file stat,
  # so java can open no jar: `Could not find or load main class
  # org.codehaus.plexus.classworlds.launcher.Launcher`. shared v0.2.0 and v0.2.1, basics v0.3.0, v0.3.1 and
  # v0.3.3, session v0.2.0, sdk v1.4.0 were lost that way on 2026-10-10, and a tag that built Error stays
  # broken. Where java cannot load Maven's launcher, .jitpack/statx.c answers statx from fstatat instead.
  # In install rather than before_install, whose output the log does not show.
  - if "$HOME/temurin25/bin/java" -cp "$(echo "$HOME"/maven/boot/plexus-classworlds-*.jar)" org.codehaus.plexus.classworlds.launcher.Launcher 2>&1 | grep -q 'classworlds configuration'; then echo "statx allowed"; else cc -shared -fPIC -O2 -o "$HOME/statx.so" .jitpack/statx.c && echo "statx refused here, preloading $HOME/statx.so"; fi
  # A tag's pom names its upstreams' released versions, written by the umbrella release in the release
  # commit (docs/refactor/43-real-versions.md), so the build needs nothing beside the checkout. JitPack
  # builds an upstream tag on demand if its build has not run yet, which is what lets the release tag the
  # chain back to back. flatten-maven-plugin writes the versions literally into the published pom. A tag
  # cut by hand from main names -SNAPSHOT upstreams, which JitPack cannot resolve: the build fails rather
  # than publishing.
  - LD_PRELOAD="$(ls "$HOME/statx.so" 2>/dev/null)" JAVA_HOME="$HOME/temurin25" PATH="$HOME/temurin25/bin:$PATH" "$HOME/maven/bin/mvn" install -DskipTests -Dmaven.javadoc.skip=true -B
