jdk:
  - openjdk21
install:
  # The committed pom pins botmaker.shared.version / botmaker.session.version to 0.0.0-SNAPSHOT (the
  # reactor/dev value). JitPack can't resolve a SNAPSHOT, so both tags are injected via -D at build time —
  # the committed pom is never edited. They come from .deps.env, written by the umbrella release.sh in this
  # release's own commit, so they are the shared/session releases this SDK tag was actually cut against
  # rather than whatever `git ls-remote --tags | tail -1` happens to return. JitPack builds those tags on
  # demand if their builds haven't run yet, which is what lets release.sh tag all three back to back.
  #
  # The -D reaches CONSUMERS only because pom.xml runs flatten-maven-plugin: Maven publishes the committed
  # pom, not the effective one. That is also why the tags below are now REQUIRED rather than defaulted. The
  # old `${SHARED_TAG:-v0.0.15}` fallbacks were harmless while the published pom kept the unresolved
  # property (a stale -D only affected the build); with flatten they would be silently BAKED INTO the
  # published pom, pointing every consumer of a hand-cut tag at a long-dead shared. Failing the build with
  # a readable message is strictly better than publishing that.
  #
  # STUDIO_API_TAG is the plugin contract (com.botmaker.plugin.api). This SDK is Studio's plugin #1, and its
  # internal.plugin classes implement that contract — an OPTIONAL dependency, so it never reaches a bot's
  # classpath, but the build still has to compile against it. Required here for the same reason as the other
  # two: flatten bakes whatever is injected into the published pom.
  #
  # There is no PLUGIN_PROCESSOR_TAG any more: the palette catalog is reflected at load time by
  # PaletteCatalog.of(...) in SdkPlugin, so this module compiles with no annotation processor at all.
  #
  # PLUGIN_TOOLKIT_TAG is the widget kit the slot editors under internal.plugin.editors are built from. It
  # IS an ordinary <dependencies> entry (optional, so it never reaches a bot), which means flatten bakes it
  # into the published pom — so it is required for the same reason SHARED_TAG is, and a stale one would be
  # published rather than merely used.
  - . ./.deps.env
  - '[ -n "${SHARED_TAG:-}" ] && [ -n "${SESSION_TAG:-}" ] && [ -n "${STUDIO_API_TAG:-}" ] && [ -n "${PLUGIN_TOOLKIT_TAG:-}" ] || { echo "ERROR: .deps.env must pin SHARED_TAG, SESSION_TAG, STUDIO_API_TAG and PLUGIN_TOOLKIT_TAG. Cut releases with the umbrella release.sh, which writes it into the release commit." >&2; exit 1; }'
  - mvn install -DskipTests -Dmaven.javadoc.skip=true -B -Dbotmaker.shared.version=$SHARED_TAG -Dbotmaker.session.version=$SESSION_TAG -Dbotmaker.studioapi.version=$STUDIO_API_TAG -Dbotmaker.plugintoolkit.version=$PLUGIN_TOOLKIT_TAG
