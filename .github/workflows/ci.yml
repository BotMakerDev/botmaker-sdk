name: CI

# The compile gate: every push and every PR builds this module. Named ci.yml to match the other repos,
# each of which now has exactly one workflow file.
#
# Tests are deliberately NOT run (`-DskipTests`): CI is a compile gate, and the suite is run locally.
# -DskipTests still *compiles* the tests, so test code that no longer builds is still caught.
#
# `jitpack` runs only on a version tag. It was a separate file (publish.yml) purely because its trigger
# differs, which a job-level `if:` expresses just as well.
#
# botmaker-shared and botmaker-session are resolved from source, not from JitPack. This repo's pom pins
# both at 0.0.0-SNAPSHOT — the version the umbrella reactor and a local `mvn install` produce — so there
# is no published artifact under those coordinates to download. Building their main branches here means
# CI compiles the same three-module pairing a maintainer builds locally.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for the tags — the api-check step below needs the PREVIOUS release tag to compare
      # against, and the default shallow checkout has no tags at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out botmaker-shared
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-shared
          path: .deps/botmaker-shared

      - name: Check out botmaker-session
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-session
          path: .deps/botmaker-session

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install botmaker-shared and botmaker-session (0.0.0-SNAPSHOT)
        run: |
          mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-session/pom.xml install -DskipTests

      - name: Build
        run: mvn -B -DskipTests package

      # The API compatibility gate. See ../docs/refactor/21-api-compat.md (umbrella) for the contract.
      #
      # What this DOES fail on, both wrong at every version, so a PR is the cheapest place to find out:
      #   - removing a public api.* member that the previous release never marked
      #     @Deprecated(since = "...", forRemoval = true);
      #   - breaking a public api.* member with no entry in META-INF/botmaker/migrations.json, i.e.
      #     leaving users no way through the change.
      #
      # What it deliberately does NOT fail on: a breaking change as such. Whether a break is allowed
      # depends on the version number being released, and no PR build knows that number — the umbrella's
      # release.sh does, and it refuses a tag the diff doesn't justify. Failing here would block every
      # legitimate major-release PR. The breaking changes are still printed, so they are visible in the log.
      - name: Previous release tag
        id: prev
        run: |
          # The newest vX.Y.Z that isn't the one being built (a tag push builds its own tag).
          current="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          prev="$(git tag --list 'v*' \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | grep -vx "${current:-__none__}" \
                    | sort -V | tail -1)"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "Comparing against ${prev:-<no previous release>}"

      - name: API compatibility
        if: steps.prev.outputs.tag != ''
        run: |
          # One command: the api-check profile runs japicmp and then ApiRulesCheck over its report.
          # failOnViolation=true is the CI shape — it fails the step on verdict 2 (removed with no
          # deprecation cycle), 3 (broken with no migration) or 4 (the migrations file itself is
          # invalid), each of which is wrong at EVERY version. Verdict 1 — a legal breaking change —
          # passes here on purpose; whether it is allowed depends on the number being tagged, which
          # release.sh decides and no PR build can know.
          mvn -B -Papi-check verify -Dmaven.test.skip=true \
              -Dbotmaker.api.oldVersion='${{ steps.prev.outputs.tag }}' \
              -Dbotmaker.api.failOnViolation=true

      # The machine-readable verdict, kept whether or not the step above passed, so a failed PR shows
      # exactly which members were named without anyone re-reading the log.
      - name: API verdict
        if: always() && steps.prev.outputs.tag != ''
        run: cat target/japicmp/api-verdict.json || true

  # JitPack builds the artifact itself from the pushed tag; this just asks it to start eagerly so the
  # first consumer doesn't wait. No secrets required.
  jitpack:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack build for ${{ github.ref_name }}
        run: |
          curl -sf "https://jitpack.io/api/builds/com.github.${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.ref_name }}" || true
