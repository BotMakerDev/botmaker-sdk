name: CI

# The compile gate: every push and every PR builds this module. Named ci.yml to match the other repos,
# each of which now has exactly one workflow file.
#
# Tests are deliberately NOT run (`-DskipTests`): CI is a compile gate, and the suite is run locally.
# -DskipTests still *compiles* the tests, so test code that no longer builds is still caught. The one
# exception that was here, ApiPointersTest, went on 2026-10-16 with the @ReplacedBy pointers it checked.
#
# `jitpack` runs only on a version tag. It was a separate file (publish.yml) purely because its trigger
# differs, which a job-level `if:` expresses just as well.
#
# All FIVE upstreams — botmaker-studio-api, botmaker-plugin-toolkit, botmaker-plugin-basics,
# botmaker-shared, botmaker-session — are resolved from source, not from JitPack. This repo's pom pins every one at its main -SNAPSHOT — the
# version the umbrella reactor and a local `mvn install` produce — so there is no published artifact under
# those coordinates to download. Building their main branches here means CI compiles the same pairing a
# maintainer builds locally.
#
# THE LIST BELOW MUST MATCH THE POM'S ${botmaker.*.version} PROPERTIES, and nothing about a local build
# can tell you when it stops matching: in the umbrella reactor each of the five is a sibling module and
# resolves for free. That is exactly how the toolkit went missing here for five days. The umbrella's
# release checks the two against each other (CiDepsGate) before it pushes a tag.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Studio plugin contract. This SDK is Studio's plugin #1 and compiles against it (an OPTIONAL
      # dependency, so it never reaches a bot's classpath — but the build still needs it present).
      - name: Check out botmaker-studio-api
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-studio-api
          path: .deps/botmaker-studio-api

      # The widget kit this module's slot editors (plugin/editors) are built from — an ordinary
      # <dependencies> entry at ${botmaker.plugintoolkit.version}, OPTIONAL so it never reaches a bot.
      # It went into the pom with phase 12a and this checkout list did not follow, which is a class of
      # break the umbrella reactor CANNOT catch: there the toolkit is a sibling module and resolves for
      # free, so `mvn install` at the root is green while this standalone build has been red on every push
      # since. The release's CiDepsGate is the gate that now compares the two.
      #
      # After studio-api, before this module's own build: the toolkit declares the contract `provided`,
      # so the contract has to be installed first rather than arriving transitively.
      - name: Check out botmaker-plugin-toolkit
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-plugin-toolkit
          path: .deps/botmaker-plugin-toolkit

      # Plugin #2, which owns the nine JDK value types this SDK builds on — an ordinary <dependencies> entry
      # at ${botmaker.pluginbasics.version}, at compile scope
      # and never optional, so it travels onto a bot's classpath with this jar.
      #
      # After the toolkit, because it declares the toolkit at compile scope and the contract `provided`:
      # both have to be installed before it rather than arriving transitively.
      # Basics' <parent> (2026-10-28), and the archetype's below, at its main -SNAPSHOT, which nothing publishes.
      - name: Check out botmaker-plugin-parent
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-plugin-parent
          path: .deps/botmaker-plugin-parent

      - name: Check out botmaker-plugin-basics
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-plugin-basics
          path: .deps/botmaker-plugin-basics

      - name: Check out botmaker-shared
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-shared
          path: .deps/botmaker-shared

      - name: Check out botmaker-session
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-session
          path: .deps/botmaker-session

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # RETRIED — Maven Central answers 429 Too Many Requests to GitHub-hosted runners often enough to have
      # failed a release (botmaker-studio, 2026-09-02, on the very first plugin descriptor of the first
      # upstream). See .github/mvn-retry.sh for why the retry cannot be a Maven flag.
      - name: Install the five upstreams (their main -SNAPSHOT)
        run: |
          source .github/mvn-retry.sh
          mvn_retry mvn -B -f .deps/botmaker-studio-api/pom.xml install -DskipTests
          mvn_retry mvn -B -f .deps/botmaker-plugin-toolkit/pom.xml install -DskipTests
          mvn_retry mvn -B -f .deps/botmaker-plugin-parent/pom.xml install
          mvn_retry mvn -B -f .deps/botmaker-plugin-basics/pom.xml install -DskipTests
          mvn_retry mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests
          mvn_retry mvn -B -f .deps/botmaker-session/pom.xml install -DskipTests

      # -DskipTests: the suite is run locally and CI is a compile gate. The never-delete japicmp gate that
      # bound to verify went on 2026-10-01 — api.* breaks freely, since Studio's upgrade drops a statement
      # whose method is gone.
      - name: Build
        run: mvn -B -DskipTests verify

      # THE PLUGIN GATE. This module is Studio's plugin #1, and the premise of the whole plugin platform is
      # that it gets no back door — a privileged default plugin, but a plugin. So the checks the catalog
      # (botmaker-catalog, the plugin registry until 2026-10-23) runs on every plugin entry run here, on
      # every push, against this build.
      #
      # Nobody had ever run them on this module until 2026-09-02, and `pom-scopes` failed the moment
      # somebody did: botmaker-studio-api was declared `optional` at `compile` where the platform's rule is
      # `provided`, which left a second copy of com.botmaker.plugin.api on this jar's own RUNTIME classpath
      # — the set a host hands to PluginLoader, where it is resolved child-first and becomes a second Class
      # object for every contract type. Exactly what `provided` exists to prevent, in the module that
      # defines the platform.
      #
      # botmaker-cli is built from source here for the same reason the other upstreams are: its pom pins
      # the contract and the loader at their main -SNAPSHOT, so there is no published artifact under those
      # coordinates. It is NOT in this module's pom and is a dependency of nothing here — it is a TOOL this
      # job runs, which is why it and its own upstream are checked out and built in their own steps rather
      # than added to the install list above. (the release's CiDepsGate compares that
      # list against this pom; a tool has no business in it.)
      #
      # botmaker-plugin-host comes with it and is easy to forget — it is the CLI's dependency, not this
      # module's, and this job's first run failed on exactly that:
      #   Could not resolve dependencies for project com.github.LiQiyeDev:botmaker-cli:jar:0.0.0-SNAPSHOT
      #   dependency: com.github.LiQiyeDev:botmaker-plugin-host:jar:0.0.0-SNAPSHOT (compile)
      # (That was 2026-09, when every pom said 0.0.0-SNAPSHOT.) The contract it also pins is already
      # installed above, at the same main -SNAPSHOT.
      #
      # `--no-build` because `mvn -B -DskipTests verify` two steps up has already compiled this module; the
      # validator would otherwise shell out to Maven and compile it a second time.
      #
      # `plugin validate`, two words, since botmaker-cli grew two nouns on 2026-09-05. This step said
      # `validate` until 2026-09-16 and had been red on every push since: the bare verb is a hidden alias
      # that prints its replacement and exits 2, so the job failed with `Unknown option: '--no-build'` and
      # the usage of a different command. It is what made the SDK unreleasable — CiGate refuses a module
      # whose main is red, and the SDK is forced into every release plugin-basics is in.
      - name: Check out botmaker-cli
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-cli
          path: .deps/botmaker-cli

      - name: Check out botmaker-plugin-host (botmaker-cli's own upstream)
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-plugin-host
          path: .deps/botmaker-plugin-host

      # The cli bundles the archetype's `template` zip (`plugin new`), resolved at its main -SNAPSHOT, which
      # nothing publishes: red on main until 2026-10-23 with "Could not find artifact
      # …botmaker-plugin-archetype:zip:template:…-SNAPSHOT". The toolkit it needs is installed above.
      - name: Check out botmaker-plugin-archetype (botmaker-cli's bundled example)
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-plugin-archetype
          path: .deps/botmaker-plugin-archetype

      - name: Plugin gate (the checks the catalog runs)
        run: |
          source .github/mvn-retry.sh
          mvn_retry mvn -B -q -f .deps/botmaker-plugin-host/pom.xml install -DskipTests
          mvn_retry mvn -B -q -f .deps/botmaker-plugin-archetype/pom.xml install -DskipTests
          mvn_retry mvn -B -q -f .deps/botmaker-cli/pom.xml package -DskipTests
          java -jar .deps/botmaker-cli/target/botmaker-cli-*-all.jar plugin validate . --no-build

  # JitPack builds the artifact itself from the pushed tag; this just asks it to start eagerly so the
  # first consumer doesn't wait. No secrets required.
  jitpack:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack build for ${{ github.ref_name }}
        run: |
          curl -sf "https://jitpack.io/api/builds/com.github.${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.ref_name }}" || true

  # The GitHub Release, published by JReleaser from the tag the umbrella's release.sh pushed.
  #
  # It runs HERE and not from the umbrella working copy for a measured reason, recorded in jreleaser.yml:
  # in a submodule checkout `.git` is a FILE (`gitdir: ../.git/modules/<mod>`) and JReleaser's JGit reports
  # "repository not found", while --git-root-search gets past it only by resolving the UMBRELLA repository.
  # A CI checkout is standalone, so neither problem exists. The tag itself stays release.sh's, because tag
  # ORDER across the eight repositories is the one thing JReleaser has no way to express.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The SAME script release.sh calls to gate this release (check_changelog). One extractor, two readers
      # in two repositories: a release whose notes come from a different rule than the one that gated it can
      # pass the gate and then publish something else. A missing section exits non-zero and fails the job,
      # which is the right outcome — release.sh should already have refused it.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target
          tools/changelog-section.sh "$version" > target/jreleaser-changelog.md
          echo "JRELEASER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      # The version comes from the tag via JRELEASER_PROJECT_VERSION above, never from the pom: JitPack
      # serves every tag as com.github.BotMakerDev:<repo>:<tag> (the tag's pom agrees since 2026-10-06).
      - name: Publish the release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
