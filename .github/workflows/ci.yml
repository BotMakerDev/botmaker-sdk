name: CI

# The compile gate: every push and every PR builds this module. Named ci.yml to match the other repos,
# each of which now has exactly one workflow file.
#
# Tests are deliberately NOT run (`-DskipTests`): CI is a compile gate, and the suite is run locally.
# -DskipTests still *compiles* the tests, so test code that no longer builds is still caught.
#
# `jitpack` runs only on a version tag. It was a separate file (publish.yml) purely because its trigger
# differs, which a job-level `if:` expresses just as well.
#
# botmaker-shared and botmaker-session are resolved from source, not from JitPack. This repo's pom pins
# both at 0.0.0-SNAPSHOT — the version the umbrella reactor and a local `mvn install` produce — so there
# is no published artifact under those coordinates to download. Building their main branches here means
# CI compiles the same three-module pairing a maintainer builds locally.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out botmaker-shared
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-shared
          path: .deps/botmaker-shared

      - name: Check out botmaker-session
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-session
          path: .deps/botmaker-session

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install botmaker-shared and botmaker-session (0.0.0-SNAPSHOT)
        run: |
          mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-session/pom.xml install -DskipTests

      - name: Build
        run: mvn -B -DskipTests package

      # There is deliberately no API compatibility gate here any more. It compared this build against the
      # previously published jar with japicmp and demanded a migrations entry for every break — an
      # apparatus that only earns its keep when a break has to be *repaired* by pointing one member at
      # another. It no longer is: Studio replaces a call to a member that is gone with a default value and
      # marks the enclosing function for review, which needs nothing declared and so nothing to check.
      # What survives on this side is @ApiId (com.botmaker.sdk.api.ApiId) and the rename-only
      # META-INF/botmaker/migrations.json, both read by Studio at upgrade time, neither verifiable here.
      # See ../docs/refactor/21-api-compat.md (umbrella).

  # JitPack builds the artifact itself from the pushed tag; this just asks it to start eagerly so the
  # first consumer doesn't wait. No secrets required.
  jitpack:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack build for ${{ github.ref_name }}
        run: |
          curl -sf "https://jitpack.io/api/builds/com.github.${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.ref_name }}" || true
