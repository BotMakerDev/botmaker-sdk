name: Build

# The unconditional gate: every push and every PR compiles this module and runs its unit tests.
# Nothing else in the refactor is verifiable without it (docs/refactor/02-execution-order.md, Phase 0).
#
# botmaker-shared and botmaker-session are resolved from source, not from JitPack. This repo's pom pins
# both at 0.0.0-SNAPSHOT — the version the umbrella reactor and a local `mvn install` produce — so there
# is no published artifact under those coordinates to download. Building their main branches here means
# CI tests the same three-module pairing a maintainer tests locally.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out botmaker-shared
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-shared
          path: .deps/botmaker-shared

      - name: Check out botmaker-session
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-session
          path: .deps/botmaker-session

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # api/vision/TextTest routes into shared's OcrEngine, which is self-contained on Windows but needs the
      # system libraries on Linux. Without them the tests skip themselves, and skipped is not covered. The
      # -dev packages carry the unversioned .so symlinks JNA resolves by bare name; the traineddata is
      # bundled in shared's jar, so no tesseract-ocr-* language package is needed.
      - name: Install OCR natives
        run: sudo apt-get update && sudo apt-get install -y libtesseract-dev libleptonica-dev

      - name: Install botmaker-shared and botmaker-session (0.0.0-SNAPSHOT)
        run: |
          mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-session/pom.xml install -DskipTests

      - name: Verify
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
